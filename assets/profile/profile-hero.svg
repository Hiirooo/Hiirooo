<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Rasyid Abdulah — Full-stack Developer dan IT Administrator</title>
  <desc id="desc">Banner profil profesional dengan nuansa biru navy, ilustrasi dashboard, dan diagram sistem.</desc>
  <defs>
