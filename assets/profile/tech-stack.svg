  </defs>
  <rect width="1200" height="204" rx="16" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="203" rx="15.5" stroke="#CDE7FF" stroke-opacity=".13"/>
  <rect x="35" y="40" width="1130" height="2" rx="1" fill="url(#line)" opacity=".72"/>

  <g font-family="Arial, Helvetica, sans-serif">
