      <text fill="#9CB4CC" font-size="10" font-weight="700" letter-spacing="1.25">FRONTEND</text>
      <circle cx="14" cy="43" r="14" fill="#E4EEF8"/><text x="9" y="48" fill="#101E31" font-size="13" font-weight="700">N</text>
      <text x="37" y="48" fill="#F3F7FC" font-size="13" font-weight="700">Next.js</text>
      <circle cx="14" cy="89" r="14" fill="#49C8F0"/><text x="9" y="94" fill="#092137" font-size="13" font-weight="700">R</text>
      <text x="37" y="94" fill="#DCE8F4" font-size="12">React · Tailwind</text>
