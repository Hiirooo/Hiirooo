      <text x="37" y="48" fill="#F3F7FC" font-size="13" font-weight="700">Laravel</text>
      <circle cx="14" cy="89" r="14" fill="#7786C4"/><text x="5" y="93" fill="white" font-size="9" font-weight="700">PHP</text>
      <text x="37" y="94" fill="#DCE8F4" font-size="12">PHP · Node.js</text>
    </g>

    <path d="M302 70V170" stroke="#FFFFFF" stroke-opacity=".12"/>
