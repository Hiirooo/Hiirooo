<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="204" viewBox="0 0 1200 204" fill="none" role="img" aria-labelledby="title">
  <title id="title">Teknologi yang digunakan: Laravel, PHP, Node.js, Next.js, React, Tailwind CSS, PostgreSQL, MySQL, Supabase, Linux, Docker, dan Cloudflare.</title>
  <defs>
