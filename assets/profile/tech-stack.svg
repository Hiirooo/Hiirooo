      <text x="37" y="48" fill="#F3F7FC" font-size="13" font-weight="700">PostgreSQL</text>
      <circle cx="14" cy="89" r="14" fill="#53CA94"/><text x="9" y="94" fill="#092A1C" font-size="13" font-weight="700">S</text>
      <text x="37" y="94" fill="#DCE8F4" font-size="12">MySQL · Supabase</text>
